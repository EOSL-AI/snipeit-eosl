[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snipeit-eosl"
version = "1.0.0"
description = "Audit a Snipe-IT inventory against the EOSL.ai hardware end-of-service-life database."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "EOSL.ai", email = "hello@eosl.ai" }]
keywords = ["snipe-it", "snipeit", "itam", "asset-management", "eol", "eosl", "end-of-life", "lifecycle"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
# Zero runtime dependencies, matching the rest of the EOSL.ai project. stdlib only.
dependencies = []

[project.urls]
Homepage = "https://eosl.ai"
Source = "https://github.com/EOSL-AI/snipeit-eosl"
Issues = "https://github.com/EOSL-AI/snipeit-eosl/issues"
Dataset = "https://eosl.ai/dataset/"

[project.scripts]
snipeit-eosl = "snipeit_eosl.cli:main"

[tool.setuptools]
packages = ["snipeit_eosl"]
